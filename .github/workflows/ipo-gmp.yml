name: IPO GMP tracker

on:
  schedule:
    - cron: "30 4 * * 1-6" # 10:00 IST, Monday to Saturday
    - cron: "30 12 * * 1-6" # 18:00 IST
  workflow_dispatch: # "Run workflow" button for a first test

permissions:
  contents: write # commit data/ back to your copy
  issues: write # only used when notify.githubIssue is true

concurrency: ipo-gmp

jobs:
  track:
    # The template itself never runs; your copy (created with "Use this template") does.
    if: github.repository != 'datadmon/india-ipo-gmp-tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch today's IPO GMP
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python ipo_gmp_tracker.py
      - name: Save the snapshot in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "IPO GMP $(date -u +%F)"
          git push
